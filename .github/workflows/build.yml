          EOF

          # 9. Node.js + Socket.IO + Unpack/Replace/Repack Engine
          cat << 'EOF' > server/package.json
          {
            "name": "rjtool-socket-engine",
            "version": "2.2.0",
            "main": "server.js",
            "dependencies": {
              "@supabase/supabase-js": "^2.43.0",
              "archiver": "^7.0.1",
              "cors": "^2.8.5",
              "dotenv": "^16.4.5",
              "express": "^4.19.2",
              "fs-extra": "^11.2.0",
              "multer": "^1.4.5-lts.1",
              "socket.io": "^4.7.5"
            },
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF

          cat << 'EOF' > server/rjtool_engine.py
          import os
          import sys
          import shutil
          import zipfile

          BASE = os.path.join(os.path.dirname(__file__), "RJTOOL")
          PAK_ORIGINAL = os.path.join(BASE, "PAK_ORIGINAL")
          PAK_UNPACK = os.path.join(BASE, "PAK_UNPACK")
          EDITTED = os.path.join(BASE, "EDITTED")
          RESULT_PAK = os.path.join(BASE, "RESULT_PAK")

          def compile(params):
              print("[SOCKET] Phase 1: Scanning PAK_ORIGINAL for clean base file...")
              shutil.rmtree(PAK_UNPACK, ignore_errors=True)
              os.makedirs(PAK_UNPACK, exist_ok=True)
              os.makedirs(RESULT_PAK, exist_ok=True)

              paks = [f for f in os.listdir(PAK_ORIGINAL) if f.endswith(".pak") or f.endswith(".zip")]
              if paks:
                  target_base = os.path.join(PAK_ORIGINAL, paks[0])
                  print(f"[SOCKET] Unpacking {paks[0]} to /PAK_UNPACK...")
                  if zipfile.is_zipfile(target_base):
                      with zipfile.ZipFile(target_base, 'r') as z:
                          z.extractall(PAK_UNPACK)
                  else:
                      shutil.copytree(PAK_ORIGINAL, PAK_UNPACK, dirs_exist_ok=True)
              else:
                  print("[SOCKET] Initializing virtual Unreal structure in PAK_UNPACK...")
                  os.makedirs(os.path.join(PAK_UNPACK, "ShadowTrackerExtra/Saved/Config"), exist_ok=True)

              print("[SOCKET] Phase 2: Replacing matching assets (.uasset, .uexp, .lua) from EDITTED...")
              count = 0
              for root, _, files in os.walk(EDITTED):
                  for file in files:
                      src = os.path.join(root, file)
                      rel = os.path.relpath(src, EDITTED)
                      dst = os.path.join(PAK_UNPACK, rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(src, dst)
                      count += 1
                      print(f"[SOCKET] Injected: {rel}")

              print(f"[SOCKET] Replaced {count} modified game assets.")

              out_file = os.path.join(RESULT_PAK, "game_patch_4.5.0.21370.pak")
              print("[SOCKET] Phase 3: Packing & Compiling to RESULT_PAK/game_patch_4.5.0.21370.pak...")
              with zipfile.ZipFile(out_file, 'w', zipfile.ZIP_DEFLATED) as z_out:
                  for root, _, files in os.walk(PAK_UNPACK):
                      for file in files:
                          full_p = os.path.join(root, file)
                          arc_p = os.path.relpath(full_p, PAK_UNPACK)
                          z_out.write(full_p, arc_p)

              print("[DONE] 100% SUCCESS: Pak compiled successfully!")

          if __name__ == "__main__":
              compile(sys.argv[1] if len(sys.argv) > 1 else "{}")
          EOF

          cat << 'EOF' > server/server.js
          const express = require('express');
          const http = require('http');
          const { Server } = require('socket.io');
          const cors = require('cors');
          const path = require('path');
          const fs = require('fs-extra');
          const multer = require('multer');
          const { spawn } = require('child_process');
          const { createClient } = require('@supabase/supabase-js');
          require('dotenv').config();

          const app = express();
          app.use(cors());
          app.use(express.json());

          const server = http.createServer(app);
          const io = new Server(server, { cors: { origin: "*" } });

          const RJTOOL_DIR = path.join(__dirname, 'RJTOOL');
          const DIRS = {
            EDITTED: path.join(RJTOOL_DIR, 'EDITTED'),
            PAK_ORIGINAL: path.join(RJTOOL_DIR, 'PAK_ORIGINAL'),
            RESULT_PAK: path.join(RJTOOL_DIR, 'RESULT_PAK')
          };
          Object.values(DIRS).forEach(d => fs.ensureDirSync(d));

          const supabase = createClient(
            process.env.SUPABASE_URL || 'https://dummy.supabase.co',
            process.env.SUPABASE_KEY || 'dummy-key'
          );

          const storage = multer.diskStorage({
            destination: (req, file, cb) => {
              cb(null, req.params.type === 'original' ? DIRS.PAK_ORIGINAL : DIRS.EDITTED);
            },
            filename: (req, file, cb) => cb(null, file.originalname)
          });
          const upload = multer({ storage });

          app.get('/manage', (req, res) => {
            const orig = fs.readdirSync(DIRS.PAK_ORIGINAL);
            const edit = fs.readdirSync(DIRS.EDITTED);
            const resFiles = fs.readdirSync(DIRS.RESULT_PAK);
            res.send(`
              <!DOCTYPE html>
              <html>
              <head>
                <title>RJTOOL Management</title>
                <script src="/socket.io/socket.io.js"></script>
                <style>
                  body { background: #0b0e14; color: #fff; font-family: monospace; padding: 25px; }
                  .card { background: #1a1f2c; padding: 18px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #334155; }
                  .btn { background: #38bdf8; padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
                </style>
              </head>
              <body>
                <h2>⚡ RJTOOL PAK MANAGER & WEBSOCKET</h2>
                <div class="card">
                  <h3>1. Upload Original PAK</h3>
                  <form action="/upload/original" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" />
                    <button class="btn" type="submit">Upload Base PAK</button>
                  </form>
                  <p>In Folder: ${orig.join(', ') || 'None'}</p>
                </div>

                <div class="card">
                  <h3>2. Upload Edited Assets (.uasset, .uexp, .lua)</h3>
                  <form action="/upload/edited" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" multiple />
                    <button class="btn" type="submit">Upload to EDITTED</button>
                  </form>
                  <p>In EDITTED: ${edit.join(', ') || 'None'}</p>
                </div>

                <div class="card">
                  <h3>3. Result Output: ${resFiles.join(', ') || 'Not Compiled'}</h3>
                  <button class="btn" style="background:#f59e0b;" onclick="socket.emit('start_custom_build', {trigger:'web'})">Trigger Full Repack</button>
                </div>
                <div id="logs" style="background:#000; color:#22c55e; padding:12px; height:150px; overflow-y:scroll;"></div>
                <script>
                  const socket = io();
                  socket.on('compile_log', l => {
                    const el = document.getElementById('logs');
                    el.innerHTML += l + '<br/>';
                    el.scrollTop = el.scrollHeight;
                  });
                </script>
              </body>
              </html>
            `);
          });

          app.post('/upload/:type', upload.single('file'), (req, res) => res.redirect('/manage'));

          app.get('/api/configs', async (req, res) => {
            try {
              const { data, error } = await supabase.from('configs').select('*');
              if (error || !data || data.length === 0) {
                return res.json([{
                  id: "1",
                  title: "AIMBOT + ANTENA V3 NEW",
                  description: "ALL VERSION - Small Crosshair, 120 FPS",
                  image_url: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500",
                  file_url: "/api/download-result-pak"
                }]);
              }
              res.json(data);
            } catch (e) {
              res.status(500).json({ error: e.message });
            }
          });

          app.get('/api/download-result-pak', (req, res) => {
            const outPath = path.join(DIRS.RESULT_PAK, 'game_patch_4.5.0.21370.pak');
            if (!fs.existsSync(outPath)) {
              fs.writeFileSync(outPath, Buffer.from([0x50, 0x41, 0x4B, 0x00, 0x01]));
            }
            res.download(outPath, 'game_patch_4.5.0.21370.pak');
          });

          io.on('connection', (sock) => {
            sock.on('start_custom_build', (data) => {
              sock.emit('compile_log', '[SOCKET] Initiating Unpack-Replace-Repack Pipeline...');
              const py = spawn('python3', [path.join(__dirname, 'rjtool_engine.py'), JSON.stringify(data)]);
              py.stdout.on('data', d => {
                const s = d.toString();
                sock.emit('compile_log', s);
                io.emit('compile_log', s);
              });
              py.stderr.on('data', d => sock.emit('compile_log', `[ERROR] ${d.toString()}`));
              py.on('close', c => sock.emit('compile_log', `[EXIT] Build completed with exit code ${c}`));
            });
          });

          const PORT = process.env.PORT || 3000;
          server.listen(PORT, () => console.log(`Server running on port ${PORT}`));
          EOF

      - name: Commit and Push Scaffolded Source to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Fix AndroidX error, configure Gradle 8.5 & add full GFX engine"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes"
          fi

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuronami-GFX-VIP
          path: app/build/outputs/apk/debug/*.apk
